:root{
  --navy:#131C31; --navy-2:#1A2440; --navy-3:#27324D;
  --pink:#FF4D94; --pink-deep:#D81B6A; --pink-hover:#B81459;
  --cream:#F2EFE8; --paper:#FAF7EF; --white:#FFFFFF;
  --blue:#33587A; --blue-deep:#2E5675; --blue-tint:#E8EEF4;
  --green:#3BA060; --green-text:#237645; --green-tint:#E6F3EA;
  --amber:#E0A52A; --amber-text:#8A5E08; --amber-tint:#FBF1DA;
  --hi:#EED296; --line:#DDD8CC; --muted:#566074; --ink:#131C31;
  --display:'Anton', Impact, 'Arial Narrow', sans-serif;
  --body:'Archivo', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--cream);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit}
h1,h2,h3{margin:0}
.hidden{display:none !important}

/* Header */
header.top{background:var(--navy);color:var(--white);position:relative;overflow:hidden}
header.top::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.4px);background-size:14px 14px;pointer-events:none}
.top-in{position:relative;max-width:1560px;margin:0 auto;padding:22px 28px;display:flex;align-items:center;gap:20px;justify-content:space-between}
.kmark{display:inline-flex;align-items:center;gap:8px;font-family:var(--display);text-transform:uppercase;font-size:18px;letter-spacing:.06em;color:var(--white);margin-bottom:8px;line-height:1}
.kmark .dot{width:10px;height:10px;border-radius:50%;background:var(--pink)}
.kmark .rv{color:var(--pink)}
.brandline{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:#C9CFDB;font-weight:600;margin-bottom:6px}
.ttl{font-family:var(--display);text-transform:uppercase;font-weight:400;font-size:38px;line-height:1.02;letter-spacing:.01em}
.ttl .l2{display:block;color:var(--pink)}
.top-actions{display:flex;gap:10px;align-items:center;flex-shrink:0}
.pill{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:9px 16px;font-weight:700;font-size:15px;border:2px solid rgba(255,255,255,.35);background:transparent;color:var(--white);cursor:pointer;text-decoration:none}
.pill:hover:not(:disabled){background:var(--white);color:var(--navy);border-color:var(--white)}
.pill:disabled{opacity:.45;cursor:not-allowed}
.pill.clock{background:var(--pink-deep);border-color:var(--pink-deep);cursor:default}
.pill.clock:hover{background:var(--pink-deep);color:var(--white);border-color:var(--pink-deep)}
.pill.clock .num{font-family:var(--display);font-weight:400;font-size:19px;letter-spacing:.03em}

/* Layout */
.wrap{max-width:1560px;margin:0 auto;padding:26px 28px 10px;display:grid;grid-template-columns:230px minmax(0,1fr);gap:28px;align-items:start}
.wrap.solo{grid-template-columns:minmax(0,1fr);max-width:1180px}
nav.rail{position:sticky;top:18px;display:flex;flex-direction:column;gap:6px}
.rail .rh{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:2px 4px 4px}
.step{display:flex;align-items:flex-start;gap:10px;text-align:left;background:var(--white);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;color:var(--ink);font-size:15px;line-height:1.3;width:100%}
.step:hover:not(:disabled){border-color:var(--navy)}
.step:disabled{cursor:not-allowed;opacity:.5}
.step .n{flex:0 0 24px;height:24px;border-radius:50%;background:var(--cream);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.step .lab{display:block}
.step .st{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.step.cur{background:var(--navy);color:var(--white);border-color:var(--navy)}
.step.cur .n{background:var(--pink);border-color:var(--pink);color:var(--white)}
.step.cur .st{color:#C9CFDB}
.step.done .n{background:var(--green);border-color:var(--green);color:var(--white)}
.step.skip .n{background:var(--amber-tint);border-color:var(--amber);color:var(--amber-text)}

main{min-width:0}
.screen{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:28px 32px;min-height:420px}
.eyebrow{font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--pink-deep);font-weight:700;margin-bottom:6px}
.h2{font-family:var(--display);text-transform:uppercase;font-weight:400;font-size:34px;line-height:1.08;letter-spacing:.01em;margin-bottom:14px}
.lede{font-size:18px;max-width:72ch;margin:0 0 18px}
p{margin:0 0 12px}
.muted{color:var(--muted)}
.small{font-size:14px}

/* Cards */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.card h3{font-size:18px;font-weight:700;margin-bottom:6px}
.card p:last-child{margin-bottom:0}
.revgrid .card{border-left:4px solid var(--blue)}
.qcard{display:flex;flex-direction:column}
.qcard .qn{font-family:var(--display);text-transform:uppercase;color:var(--pink-deep);font-size:16px;letter-spacing:.04em}
.qcard h3{font-family:var(--display);text-transform:uppercase;font-weight:400;font-size:26px;line-height:1.1;margin:4px 0 4px}
.qcard ul{margin:6px 0 14px;padding-left:20px;font-size:15px}
.qcard .grow{flex:1}
.chip{display:inline-block;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700;background:var(--cream);border:1px solid var(--line);color:var(--muted)}
.chip.ok{background:var(--green-tint);border-color:var(--green);color:var(--green-text)}
.chip.go{background:var(--amber-tint);border-color:var(--amber);color:var(--amber-text)}
.chip.lv{background:var(--blue-tint);border-color:var(--blue);color:var(--blue-deep)}
.howto .card .big{font-family:var(--display);font-size:30px;color:var(--pink-deep);line-height:1}

/* Notes */
.note{border-radius:10px;padding:13px 16px;background:var(--blue-tint);border-left:4px solid var(--blue);margin:0 0 16px;font-size:16px}
.note.ok{background:var(--green-tint);border-left-color:var(--green)}
.note.fix{background:var(--amber-tint);border-left-color:var(--amber)}
.note.rr{background:var(--pink);color:var(--white);border-left:0;font-size:17px;padding:15px 18px}
.note.rr b{font-family:var(--display);font-weight:400;text-transform:uppercase;letter-spacing:.04em;font-size:19px;display:block;margin-bottom:2px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--pink-deep);color:var(--white);border:2px solid var(--pink-deep);border-radius:10px;padding:11px 20px;font-weight:700;font-size:16px;cursor:pointer;text-decoration:none;line-height:1.2}
.btn:hover:not(:disabled){background:var(--pink-hover);border-color:var(--pink-hover)}
.btn:disabled{background:#C9C3B6;border-color:#C9C3B6;color:#5E6472;cursor:not-allowed}
.btn.ghost{background:var(--white);color:var(--navy);border-color:var(--navy)}
.btn.ghost:hover:not(:disabled){background:var(--navy);color:var(--white)}
.btn.ghost:disabled{background:var(--white);color:#8A8F9A;border-color:#C9C3B6}
.btn.link{background:none;border:0;color:var(--blue-deep);padding:6px 2px;text-decoration:underline;font-weight:600}
.btn.link:hover:not(:disabled){background:none;color:var(--navy)}
.btn.sm{padding:8px 14px;font-size:15px}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.nextrow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:24px;padding-top:18px;border-top:1px solid var(--line);flex-wrap:wrap}
.nextrow .right{display:flex;align-items:center;gap:12px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.gatehint{color:var(--amber-text);font-weight:600;font-size:15px}
.btnrow{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* Recall */
textarea{width:100%;min-height:260px;border:2px solid var(--line);border-radius:12px;padding:14px 16px;font-family:var(--body);font-size:17px;line-height:1.6;background:var(--white);color:var(--ink);resize:vertical}
textarea:focus{border-color:var(--blue);outline:none}
.count{font-size:14px;color:var(--muted);margin-top:6px}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(19,28,49,.62);display:flex;align-items:center;justify-content:center;padding:18px;z-index:50}
.modal{background:var(--paper);border-radius:16px;max-width:720px;width:100%;max-height:calc(100vh - 36px);overflow:auto;padding:24px 26px;box-shadow:0 18px 50px rgba(0,0,0,.3)}
.modal ol{margin:6px 0 16px;padding-left:24px}
.modal li{margin:0 0 8px}

/* Quiz */
.timerbar{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--navy);color:var(--white);border-radius:12px;padding:12px 18px;margin-bottom:18px;flex-wrap:wrap}
.timerbar .clk{font-family:var(--display);font-size:30px;letter-spacing:.03em;line-height:1}
.timerbar .clk.low{color:var(--hi)}
.timerbar .meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-weight:600}
.timerbar .chip.lv{background:var(--navy-3);border-color:var(--navy-3);color:var(--white)}
.qdots{display:flex;gap:5px;flex-wrap:wrap}
.qdots span{width:12px;height:12px;border-radius:50%;background:var(--navy-3);display:inline-block}
.qdots span.a{background:#8C95A8}
.qdots span.c{background:var(--pink)}
.prompt{font-size:21px;font-weight:600;line-height:1.4;margin:0 0 18px;max-width:80ch}
.opts{display:flex;flex-direction:column;gap:10px;max-width:900px}
.opt{text-align:left;background:var(--white);border:2px solid var(--line);border-radius:12px;padding:13px 16px;cursor:pointer;color:var(--ink);font-size:17px;line-height:1.4;display:flex;gap:12px;align-items:flex-start}
.opt .k{flex:0 0 28px;height:28px;border-radius:50%;background:var(--cream);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.opt:hover:not(:disabled){border-color:var(--navy)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--green);background:var(--green-tint)}
.opt.right .k{background:var(--green);border-color:var(--green);color:var(--white)}
.opt.wrong{border-color:var(--amber);background:var(--amber-tint)}
.opt.wrong .k{background:var(--amber);border-color:var(--amber);color:var(--navy)}
.opt.missed{border-style:dashed;border-color:var(--green)}
.fb{margin-top:16px;max-width:900px}
.v{font-weight:700;display:block;margin-bottom:2px}

/* Results */
.score{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.score .big{font-family:var(--display);font-size:64px;line-height:1;color:var(--navy)}
.score .of{font-size:20px;font-weight:700;color:var(--muted)}
.lvrow{display:grid;grid-template-columns:150px minmax(0,1fr) 70px;gap:14px;align-items:center;margin:0 0 4px}
.lvrow .nm{font-weight:700}
.bar{height:14px;background:var(--cream);border:1px solid var(--line);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green)}
.lvrow .sc{font-weight:700;text-align:right}
.lvtext{margin:0 0 16px 164px;font-size:15px;color:var(--muted)}

footer.tm{max-width:1560px;margin:0 auto;padding:14px 28px 28px;font-style:italic;font-size:14px;color:var(--muted)}
footer.tm .lic{font-style:normal;font-size:12px;margin-top:6px}

/* Phone */
@media (max-width:700px){
  body{font-size:16px}
  .top-in{padding:14px 16px;gap:10px;flex-direction:column;align-items:stretch}
  .top-actions{justify-content:flex-start}
  .brandline{font-size:11px;margin-bottom:4px}
  .kmark{font-size:15px;margin-bottom:6px}
  .ttl{font-size:25px}
  .pill{padding:7px 12px;font-size:13px}
  .pill.clock .num{font-size:16px}
  .wrap{grid-template-columns:minmax(0,1fr);padding:12px 16px 6px;gap:12px}
  nav.rail{position:sticky;top:0;z-index:5;flex-direction:row;overflow-x:auto;gap:6px;padding:8px 0;background:var(--cream);scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  nav.rail::-webkit-scrollbar{display:none}
  .rail .rh{display:none}
  .step{flex:0 0 auto;width:auto;max-width:210px;padding:8px 10px;font-size:13px;scroll-snap-align:center}
  .step .st{display:none}
  .screen{padding:18px 16px;border-radius:12px;min-height:0}
  .h2{font-size:26px}
  .lede{font-size:16px}
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
  .prompt{font-size:18px}
  .opt{font-size:16px;padding:11px 12px}
  .timerbar .clk{font-size:24px}
  .score .big{font-size:50px}
  .lvrow{grid-template-columns:96px minmax(0,1fr) 46px;gap:8px}
  .lvtext{margin-left:0}
  .nextrow .btn{flex:1 1 auto}
  .nextrow .right{width:100%}
  footer.tm{padding:10px 16px 22px;font-size:13px}
  .modal{padding:18px 16px}
}
</style>
</head>

  <div>
    <div class="kmark" aria-label="Kula Revise"><span class="dot"></span>Kula <span class="rv">Revise</span></div>
    <div class="brandline">IB History · Paper 2 · Causes and effects of 20th-century wars</div>
    <h1 class="ttl" id="ttl"><span>The First World War</span><span class="l2">The course of the war</span></h1>
  </div>

</div></header>

<div class="wrap" id="wrap">

</div>

<script>

        { h: "The Battle of the Marne", p: "General von Kluck's First Army turned to pass east of Paris instead of sweeping round it. French airmen spotted the move. On 5 September the French Sixth Army, sent out from Paris by its military governor, General Gallieni, struck Kluck's exposed flank. When Kluck turned to meet it, a gap of about 50 km opened between his army and the German Second Army. Joffre, the French commander-in-chief, sent the BEF and the French Fifth Army into the gap." },
        { h: "The plan fails", p: "Moltke, far away at his headquarters in Luxembourg, had poor news of the fighting. On 9 September the German retreat began, and the armies dug in on high ground above the River Aisne. On 14 September Falkenhayn replaced Moltke. There would be no quick victory." },

        { h: "The Hundred Days", p: "On 8 August 1918, at Amiens, the Allies attacked with tanks, artillery, infantry and aircraft working together. Ludendorff later called 8 August the \"black day\" of the German army. The Allies kept advancing, and Germany's allies, Bulgaria, the Ottoman Empire and Austria-Hungary, made peace one by one. With mutiny in the navy and revolution at home, the Kaiser abdicated on 9 November. The armistice took effect at 11 am on 11 November 1918." }
      ],
      facts: [
        "Tsar Nicholas II abdicated in March 1917.",
        "The Bolsheviks took power in November 1917 and made peace at Brest-Litovsk in March 1918.",
        "Peace in the east let Germany move dozens of divisions to the Western Front.",
        "Ludendorff's Spring Offensive began on 21 March 1918, to win before US troops arrived in large numbers.",
        "Stormtroopers made big gains, but Germany lost its best men and took no decisive objective.",
        "Foch became supreme commander of the Allied armies in 1918.",
        "At Amiens on 8 August 1918 tanks, artillery, infantry and aircraft attacked together.",
        "Germany's allies made peace, the Kaiser abdicated on 9 November, and the armistice took effect on 11 November 1918."
      ]
    }
  ],
  questions: [
    { id: "q3r1", level: "recall",
      prompt: "Which was the only full battle between the British and German battle fleets?",
      options: [
        { t: "Jutland", ok: true, why: "At Jutland, on 31 May and 1 June 1916, the Grand Fleet and the High Seas Fleet met in full for the only time." },
        { t: "Dogger Bank", why: "Dogger Bank, in January 1915, was a clash between battlecruiser squadrons, not the full fleets." },
        { t: "Heligoland Bight", why: "Heligoland Bight, in August 1914, was a smaller action near the German coast." },
        { t: "The Falkland Islands", why: "At the Falklands in December 1914 the British destroyed von Spee's overseas squadron, not the main German fleet." }
      ] },
    { id: "q3r2", level: "recall",
      prompt: "In which year did the USA declare war on Germany?",
      options: [
        { t: "1917", ok: true, why: "The USA declared war on 6 April 1917, after Germany resumed unrestricted submarine warfare and the Zimmermann Telegram was published." },
        { t: "1915", why: "The Lusitania was sunk in 1915, but the USA stayed neutral after Germany limited its attacks." },
        { t: "1916", why: "The USA was still neutral in 1916." },
        { t: "1918", why: "By 1918 American troops were already arriving in France. War had been declared in April 1917." }
      ] },
    { id: "q3r3", level: "recall",
      prompt: "What was the Zimmermann Telegram?",
      options: [
        { t: "A German offer to Mexico of land in the USA if Mexico joined Germany", ok: true, why: "British codebreakers intercepted it, and its publication in March 1917 turned American opinion further against Germany." },
        { t: "A British warning to the USA about the U-boat campaign", why: "The telegram was German. Britain's part was to intercept and decode it." },
        { t: "An American ultimatum to Germany", why: "The telegram was sent by the German foreign secretary, Arthur Zimmermann, not by the USA." },
        { t: "A Russian request to Germany for peace", why: "Russia's peace with Germany came later, at Brest-Litovsk in March 1918." }
      ] },
    { id: "q3r4", level: "recall",
      prompt: "What did Britain's Defence of the Realm Act of 1914 do?",
      options: [
        { t: "It gave the government wide powers over industry, transport and the press", ok: true, why: "DORA is a clear example of the state taking control of daily life in total war." },
        { t: "It introduced conscription", why: "Britain introduced conscription later, in 1916." },
        { t: "It gave women the vote", why: "Some British women gained the vote in 1918, under a different law." },
        { t: "It set up the convoy system", why: "Convoys were a naval measure introduced in 1917." }
      ] },
    { id: "q3r5", level: "recall",
      prompt: "Which treaty took Russia out of the war in March 1918?",
      options: [
        { t: "Brest-Litovsk", ok: true, why: "The Bolsheviks signed the Treaty of Brest-Litovsk with Germany in March 1918, giving up huge areas of land." },
        { t: "Versailles", why: "The Treaty of Versailles was signed with Germany in 1919, after the war." },
        { t: "The Treaty of London", why: "The Treaty of London of 1839 guaranteed Belgian neutrality; another, in 1915, brought Italy into the war." },
        { t: "Bucharest", why: "Romania, not Russia, made peace with the Central Powers at Bucharest in 1918." }
      ] },
    { id: "q3u1", level: "understand",
      prompt: "Why did Germany resume unrestricted submarine warfare in February 1917, knowing it might bring the USA into the war?",
      options: [
        { t: "It gambled that Britain could be starved out before American forces could make a difference", ok: true, why: "German leaders expected the USA to join, but believed its army would arrive too late." },
        { t: "The USA had already declared war", why: "The USA declared war in April 1917, after the campaign resumed." },
        { t: "Jutland had destroyed the Royal Navy", why: "The Royal Navy kept control of the North Sea after Jutland." },
        { t: "Russia had already left the war", why: "In February 1917 Russia was still fighting. It stopped after the Bolshevik revolution and made peace in March 1918." }
      ] },
    { id: "q3u2", level: "understand",
      prompt: "Why is Jutland seen as a British strategic success, even though Britain lost more ships?",
      options: [
        { t: "The German fleet went back to port and did not seriously challenge British control of the North Sea again", ok: true, why: "Britain kept command of the sea, so the blockade of Germany went on." },
        { t: "Germany surrendered its fleet after the battle", why: "The German fleet stayed in German hands until it was interned at Scapa Flow after the armistice in November 1918." },
        { t: "The battle destroyed the German U-boat fleet", why: "Jutland was a battle of surface ships. The U-boat campaign went on and grew in 1917." },
        { t: "The US Navy then took over the North Sea", why: "The USA was still neutral in 1916." }
      ] },
    { id: "q3u3", level: "understand",
      prompt: "Why did the German Spring Offensive of 1918 fail, despite its large early gains?",
      options: [
        { t: "Germany lost many of its best troops, outran its supplies and took no decisive objective, while American troops kept arriving", ok: true, why: "The advance was costly and could not be sustained. Germany could not replace its losses, but the Allies could." },
        { t: "Germany had no extra troops, because Russia was still fighting", why: "Brest-Litovsk had ended the war in the east, so Germany could move dozens of divisions west." },
        { t: "Germany used the same tactics as at the Somme", why: "The offensive used new stormtrooper tactics and a short, intense bombardment." },
        { t: "Britain had already surrendered the Channel ports", why: "The Channel ports were never taken." }
      ] },
    { id: "q3u4", level: "understand",
      prompt: "Why did convoys reduce Allied shipping losses?",
      options: [
        { t: "Ships in escorted groups were harder for U-boats to find and more dangerous to attack", ok: true, why: "A convoy was one target in a large ocean, and escorts armed with depth charges could hunt any U-boat that attacked." },
        { t: "Convoys sailed only at night", why: "Convoys sailed by day and night. Their protection came from grouping and escorts." },
        { t: "An international agreement banned U-boat attacks", why: "There was no such agreement during the war." },
        { t: "The USA paid Germany to stop its attacks", why: "No such deal was made. The USA was at war with Germany from April 1917." }
      ] },
    { id: "q3a1", level: "apply",
      prompt: "A student argues: \"Sea power was the most important reason for Germany's defeat.\" Which evidence most supports this claim?",
      options: [
        { t: "The British blockade caused severe food shortages, weakening German civilians and the army by 1918", ok: true, why: "This links sea power to Germany's collapse. A strong essay would weigh it against the fighting on land in 1918." },
        { t: "At Amiens, tanks, artillery, infantry and aircraft attacked together", why: "This is evidence for land warfare and technology, not sea power." },
        { t: "The Spring Offensive cost Germany many of its best troops", why: "This points to failure on land, not to sea power." },
        { t: "Brest-Litovsk let Germany move troops west", why: "This strengthened Germany for a time, so it does not support the claim." }
      ] },
    { id: "q3a2", level: "apply",
      prompt: "\"By the summer of 1918, hundreds of thousands of American troops were arriving in France every month.\" Which factor in the outcome of the war does this evidence show at work?",
      options: [
        { t: "The Allies' greater manpower and resources", ok: true, why: "Germany could not replace its losses, while the Allies grew stronger every month. This evidence fits that factor." },
        { t: "German skill in new tactics", why: "Stormtrooper tactics were German. This evidence is about Allied numbers." },
        { t: "The French army mutinies", why: "The mutinies were in 1917 and weakened the Allies. This evidence shows the Allies growing stronger." },
        { t: "The failure of Allied generals", why: "The evidence is about reinforcements arriving, not about command." }
      ] },
    { id: "q3a3", level: "apply",
      prompt: "Read this student sentence: \"Total war affected everyone in Britain and life was very hard.\" What is its main weakness?",
      options: [
        { t: "It is too general: it gives no specific evidence and does not link the home front to the course of the war", ok: true, why: "A stronger sentence would name evidence, such as DORA, conscription in 1916 or rationing in 1918, and say how it helped or hindered the war effort." },
        { t: "It is inaccurate, because total war only affected soldiers", why: "Total war affected civilians too. That is what makes it total. The problem is the lack of evidence and argument." },
        { t: "It must name a historian", why: "A historian's view can help, but this sentence first needs evidence and a point." },
        { t: "It is too long", why: "The sentence is short. Its problem is that it says very little." }
      ] }
  ]
}
];

</script>
<script>
(function(){
"use strict";
var QUIZ_MINUTES = 15;
var KEY_PREFIX = "ww1-course-quizzes:v1:";
var LEVELS = [
  { id:"recall", name:"Recall", text:"What happened, when, and who was involved." , tip:"Go back over the revision cards and your recall lists, then try again." },
  { id:"understand", name:"Understand", text:"Why events happened and what they led to.", tip:"For each event on the cards, ask yourself why it happened and what followed from it." },
  { id:"apply", name:"Apply", text:"Using what you know as you would in an essay: choosing evidence for a claim, linking evidence to a factor, and making judgements.", tip:"For each fact, ask what it shows, not only what it says." }
];
var LETTERS = ["A","B","C","D","E"];

/* ---------- storage ---------- */
function load(k){ try{ var v = window.localStorage.getItem(KEY_PREFIX+k); return v ? JSON.parse(v) : null; }catch(e){ return null; } }
function save(k,v){ try{ window.localStorage.setItem(KEY_PREFIX+k, JSON.stringify(v)); }catch(e){} }
function remove(k){ try{ window.localStorage.removeItem(KEY_PREFIX+k); }catch(e){} }

function freshState(Q){
  return { pos:0, skipped:false, recall:Q.cards.map(function(){ return { text:"", checked:false }; }), seenCard:Q.cards.map(function(){return false;}), quiz:null };
}
var mem = {};
function getState(Q){
  if(mem[Q.id]) return mem[Q.id];
  var s = load(Q.id);
  if(!s || !s.recall || s.recall.length !== Q.cards.length){ s = freshState(Q); }
  if(!s.seenCard) s.seenCard = Q.cards.map(function(){return false;});
  mem[Q.id] = s; return s;
}
function put(Q){ save(Q.id, mem[Q.id]); }

/* ---------- helpers ---------- */
function esc(t){ return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function el(id){ return document.getElementById(id); }
function shuffle(a){ a = a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function fmt(ms){ if(ms<0) ms=0; var s=Math.ceil(ms/1000); var m=Math.floor(s/60); s=s%60; return m+":"+(s<10?"0":"")+s; }
function lines(t){ return t.split(/\n/).map(function(x){return x.trim();}).filter(function(x){return x.length>0;}).length; }
function byId(id){ for(var i=0;i<QUIZZES.length;i++){ if(QUIZZES[i].id===id) return QUIZZES[i]; } return null; }

/* screens: 0 intro, 1..2n revise (card, recall), then quiz start, questions, results */
function layout(Q){
  var n = Q.cards.length, m = Q.questions.length;
  return { n:n, m:m, intro:0, card:function(i){return 1+2*i;}, recall:function(i){return 2+2*i;}, start:1+2*n, q:function(j){return 2+2*n+j;}, results:2+2*n+m, total:3+2*n+m };
}
function kindOf(Q,pos){
  var L = layout(Q);
  if(pos===L.intro) return {k:"intro"};
  if(pos<L.start){ var i=Math.floor((pos-1)/2); return (pos-1)%2===0 ? {k:"card",i:i} : {k:"recall",i:i}; }
  if(pos===L.start) return {k:"start"};
  if(pos<L.results) return {k:"q", j:pos-L.q(0)};
  return {k:"results"};
}
function quizRunning(S){ return !!(S.quiz && !S.quiz.done); }
function quizDone(S){ return !!(S.quiz && S.quiz.done); }

/* ---------- app state ---------- */
var current = null; // quiz id or null for picker
var confirmReset = null;
var ticker = null;

function go(qid){
  current = qid;
  try{ window.localStorage.setItem(KEY_PREFIX+"last", qid || ""); }catch(e){}
  render(); window.scrollTo(0,0);
}

function setPos(Q, pos){
  var S = getState(Q);
  S.pos = pos;
  var k = kindOf(Q,pos);
  if(k.k==="card") S.seenCard[k.i] = true;
  put(Q); render(); window.scrollTo(0,0);
}

/* lock: true when current screen is an unchecked recall */
function navLocked(Q,S){
  var k = kindOf(Q,S.pos);
  return k.k==="recall" && !S.recall[k.i].checked;
}

/* ---------- timer ---------- */
function checkExpiry(){
  if(!current) return;
  var Q = byId(current), S = getState(Q);
  if(quizRunning(S) && Date.now() >= S.quiz.endAt){
    finishQuiz(Q, true);
  }
}
function finishQuiz(Q, timedOut){
  var S = getState(Q);
  if(!S.quiz || S.quiz.done) return;
  S.quiz.done = true;
  S.quiz.timedOut = !!timedOut;
  S.quiz.usedMs = Math.min(Date.now() - S.quiz.startedAt, QUIZ_MINUTES*60000);
  S.pos = layout(Q).results;
  put(Q); render(); window.scrollTo(0,0);
}
function tick(){
  checkExpiry();
  if(!current) return;
  var Q = byId(current), S = getState(Q);
  if(!quizRunning(S)) return;
  var left = S.quiz.endAt - Date.now();
  var a = el("clockPill"); if(a) a.querySelector(".num").textContent = fmt(left);
  var b = el("clk"); if(b){ b.textContent = fmt(left); if(left < 120000) b.classList.add("low"); }
}
function startTicker(){ if(!ticker) ticker = setInterval(tick, 1000); }

/* ---------- rendering ---------- */
function render(){
  closeModal();
  checkExpiryQuiet();
  if(!current){ renderPicker(); return; }
  var Q = byId(current); if(!Q){ current=null; renderPicker(); return; }
  var S = getState(Q);
  if(S.pos >= layout(Q).total) S.pos = 0;
  el("wrap").classList.remove("solo");
  el("ttl").innerHTML = '<span>The First World War</span><span class="l2">Quiz '+Q.num+' · '+esc(Q.title)+'</span>';
  renderTop(Q,S);
  renderRail(Q,S);
  var k = kindOf(Q,S.pos);
  if(k.k==="intro") renderIntro(Q,S);
  else if(k.k==="card") renderCard(Q,S,k.i);
  else if(k.k==="recall") renderRecall(Q,S,k.i);
  else if(k.k==="start") renderStart(Q,S);
  else if(k.k==="q") renderQuestion(Q,S,k.j);
  else renderResults(Q,S);
  var cur = document.querySelector(".step.cur");
  if(cur && cur.scrollIntoView && window.matchMedia && window.matchMedia("(max-width:700px)").matches){
    try{ cur.scrollIntoView({block:"nearest", inline:"center"}); }catch(e){}
  }
}
function checkExpiryQuiet(){
  QUIZZES.forEach(function(Q){
    var S = getState(Q);
    if(quizRunning(S) && Date.now() >= S.quiz.endAt){
      S.quiz.done = true; S.quiz.timedOut = true; S.quiz.usedMs = QUIZ_MINUTES*60000;
      if(current===Q.id) S.pos = layout(Q).results;
      put(Q);
    }
  });
}

function renderTop(Q,S){
  var locked = navLocked(Q,S);
  var h = "";
  if(quizRunning(S)) h += '<span class="pill clock" id="clockPill" aria-live="off"><span class="num">'+fmt(S.quiz.endAt-Date.now())+'</span> left</span>';
  h += '<button class="pill" id="homeBtn" '+(locked?"disabled":"")+'>All quizzes</button>';
  el("topActions").innerHTML = h;
  el("homeBtn").onclick = function(){ go(null); };
}

function stepStatus(Q,S,i){
  var r = S.recall[i];
  if(r.checked) return {c:"done", t:"Done"};
  if(S.skipped && !S.seenCard[i]) return {c:"skip", t:"Skipped"};
  if(S.seenCard[i]) return {c:"", t:"Started"};
  return {c:"", t:"To do"};
}
function renderRail(Q,S){
  var L = layout(Q), k = kindOf(Q,S.pos), locked = navLocked(Q,S), running = quizRunning(S);
  var h = '<div class="rh">Quiz '+Q.num+'</div>';
  var items = [];
  items.push({ lab:"How it works", n:"i", pos:L.intro, cur:k.k==="intro", cls: "", st:"", dis: locked || running });
  Q.cards.forEach(function(c,i){
    var st = stepStatus(Q,S,i);
    items.push({ lab:c.title, n:String(i+1), pos:L.card(i), cur:(k.k==="card"||k.k==="recall") && k.i===i, cls:st.c, st:"Revise and recall · "+st.t, dis: locked || running });
  });
  var qpos = L.start, qst = QUIZ_MINUTES+" minutes · Not started";
  if(running){ qpos = firstUnanswered(Q,S); qst = "Clock running"; }
  else if(quizDone(S)){ qpos = L.q(0); qst = "Finished · review"; }
  items.push({ lab:"Timed quiz", n:"Q", pos:qpos, cur:k.k==="start"||k.k==="q", cls: quizDone(S)?"done":"", st:qst, dis: locked });
  items.push({ lab:"Results", n:"R", pos:L.results, cur:k.k==="results", cls: quizDone(S)?"done":"", st: quizDone(S) ? (scoreOf(Q,S).total+" of "+Q.questions.length) : "After the quiz", dis: locked || !quizDone(S) });
  items.forEach(function(it, idx){
    h += '<button class="step '+(it.cur?"cur ":"")+it.cls+'" data-pos="'+it.pos+'" '+(it.dis&&!it.cur?"disabled":"")+'><span class="n">'+(it.cls==="done"&&!it.cur?"✓":esc(it.n))+'</span><span><span class="lab">'+esc(it.lab)+'</span>'+(it.st?'<span class="st">'+esc(it.st)+'</span>':'')+'</span></button>';
  });
  el("rail").innerHTML = h;
  Array.prototype.forEach.call(el("rail").querySelectorAll(".step"), function(b){
    b.onclick = function(){ if(b.disabled) return; setPos(Q, parseInt(b.getAttribute("data-pos"),10)); };
  });
}

function nextRow(opts){
  // opts: back:{label,fn,disabled}, next:{label,fn,disabled,hint}, extra html
  var h = '<div class="nextrow">';
  if(opts.back) h += '<button class="btn ghost" id="backBtn" '+(opts.back.disabled?"disabled":"")+'>'+esc(opts.back.label||"Back")+'</button>';
  else h += '<span></span>';
  h += '<div class="right">';
  if(opts.extra) h += opts.extra;
  if(opts.next){
    if(opts.next.disabled && opts.next.hint) h += '<span class="gatehint">'+esc(opts.next.hint)+'</span>';
    h += '<button class="btn" id="nextBtn" '+(opts.next.disabled?"disabled":"")+'>'+esc(opts.next.label||"Next")+'</button>';
  }
  h += '</div></div>';
  return h;
}
function wireNext(opts){
  if(opts.back && el("backBtn")) el("backBtn").onclick = function(){ if(!opts.back.disabled) opts.back.fn(); };
  if(opts.next && el("nextBtn")) el("nextBtn").onclick = function(){ if(!opts.next.disabled) opts.next.fn(); };
}

/* ---------- picker ---------- */
function quizStatus(Q){
  var S = getState(Q);
  if(quizDone(S)) return { cls:"ok", t:"Finished · "+scoreOf(Q,S).total+" of "+Q.questions.length, btn:"Open" };
  if(quizRunning(S)) return { cls:"go", t:"Clock running", btn:"Continue" };
  var started = S.pos>0 || S.recall.some(function(r){return r.text.trim().length>0;}) || S.seenCard.some(function(x){return x;});
  if(started) return { cls:"go", t:"In progress", btn:"Continue" };
  return { cls:"", t:"Not started", btn:"Start" };
}
function renderPicker(){
  el("wrap").classList.add("solo");
  el("rail").innerHTML = "";
  el("ttl").innerHTML = '<span>The First World War</span><span class="l2">The course of the war</span>';
  el("topActions").innerHTML = "";
  var h = '<section class="screen">';
  h += '<div class="eyebrow">Three timed quizzes</div><h2 class="h2">How the war was fought</h2>';
  h += '<p class="lede">These quizzes cover the course of the war, from the opening campaigns of 1914 to the armistice. Each one starts with four revision cards. After each card you write down what you remember, then check it. Then you sit a '+QUIZ_MINUTES+'-minute quiz with questions at three levels: recall, understand and apply.</p>';
  h += '<div class="grid g3">';
  QUIZZES.forEach(function(Q){
    var st = quizStatus(Q);
    h += '<div class="card qcard"><div class="qn">Quiz '+Q.num+'</div><h3>'+esc(Q.title)+'</h3><div class="muted small">'+esc(Q.span)+'</div><ul>';
    Q.cards.forEach(function(c){ h += '<li>'+esc(c.title)+'</li>'; });
    h += '</ul><div class="grow"></div><div style="margin-bottom:12px"><span class="chip '+st.cls+'">'+esc(st.t)+'</span></div>';
    h += '<div class="btnrow"><button class="btn" data-open="'+Q.id+'">'+st.btn+'</button>';
    if(st.btn!=="Start") h += '<button class="btn link" data-reset="'+Q.id+'">Start again</button>';
    h += '</div>';
    if(confirmReset===Q.id){
      h += '<div class="note fix" style="margin:12px 0 0">This clears your recall lists and quiz answers for this quiz.<div class="btnrow" style="margin-top:8px"><button class="btn sm" data-yes="'+Q.id+'">Clear and start again</button><button class="btn ghost sm" data-no="1">Keep my work</button></div></div>';
    }
    h += '</div>';
  });
  h += '</div></section>';
  el("main").innerHTML = h;
  Array.prototype.forEach.call(document.querySelectorAll("[data-open]"), function(b){ b.onclick=function(){ confirmReset=null; go(b.getAttribute("data-open")); }; });
  Array.prototype.forEach.call(document.querySelectorAll("[data-reset]"), function(b){ b.onclick=function(){ confirmReset=b.getAttribute("data-reset"); renderPicker(); }; });
  Array.prototype.forEach.call(document.querySelectorAll("[data-yes]"), function(b){ b.onclick=function(){ var id=b.getAttribute("data-yes"); var Q=byId(id); mem[id]=freshState(Q); put(Q); confirmReset=null; renderPicker(); }; });
  Array.prototype.forEach.call(document.querySelectorAll("[data-no]"), function(b){ b.onclick=function(){ confirmReset=null; renderPicker(); }; });
}

/* ---------- intro ---------- */
function renderIntro(Q,S){
  var L = layout(Q);
  var h = '<section class="screen">';
  h += '<div class="eyebrow">Quiz '+Q.num+' · '+esc(Q.span)+'</div><h2 class="h2">How it works</h2>';
  h += '<p class="lede">'+esc(Q.blurb)+'</p>';
  h += '<div class="grid g3 howto">';
  h += '<div class="card"><div class="big">1</div><h3>Read a revision card</h3><p>Each card covers one part of the war. Read it carefully: you will not be able to look back while you recall it.</p></div>';
  h += '<div class="card"><div class="big">2</div><h3>Write down what you remember</h3><p>Write the six to eight most important facts from memory, then check your list against the key facts and add any you missed. Pulling facts out of memory is what makes them stick.</p></div>';
  h += '<div class="card"><div class="big">3</div><h3>Sit the timed quiz</h3><p>'+Q.questions.length+' questions in '+QUIZ_MINUTES+' minutes. Some test what you know, some test why things happened, and some ask you to use what you know as you would in an essay.</p></div>';
  h += '</div>';
  if(quizRunning(S)) h += '<div class="note fix" style="margin-top:16px">Your quiz clock is running. Go to the timed quiz to continue.</div>';
  var running = quizRunning(S);
  h += nextRow({ back:{label:"All quizzes", fn:function(){go(null);}},
    extra: (running ? '' : '<button class="btn ghost" id="skipBtn">I have revised: skip to the quiz</button>'),
    next:{ label: running ? "Go to the quiz" : "Start the revision", fn:function(){ setPos(Q, running ? firstUnanswered(Q,S) : L.card(0)); } } });
  h += '</section>';
  el("main").innerHTML = h;
  wireNext({ back:{fn:function(){go(null);}}, next:{fn:function(){ setPos(Q, running ? firstUnanswered(Q,S) : L.card(0)); }} });
  if(el("skipBtn")) el("skipBtn").onclick = function(){ S.skipped = true; setPos(Q, L.start); };
}

/* ---------- revision card ---------- */
function renderCard(Q,S,i){
  var L = layout(Q), c = Q.cards[i];
  var h = '<section class="screen">';
  h += '<div class="note rr"><b>Read and remember</b>Read this screen carefully. On the next screen you will write down the most important facts from memory, without looking back.</div>';
  h += '<div class="eyebrow">Revision card '+(i+1)+' of '+Q.cards.length+'</div><h2 class="h2">'+esc(c.title)+'</h2>';
  h += '<div class="grid '+(c.blocks.length>1?"g2":"")+' revgrid">';
  c.blocks.forEach(function(b){ h += '<div class="card"><h3>'+esc(b.h)+'</h3><p>'+esc(b.p)+'</p></div>'; });
  h += '</div>';
  var backPos = i===0 ? L.intro : L.recall(i-1);
  var extra = i===0 ? '<button class="btn link" id="skipBtn">Skip the revision</button>' : '';
  h += nextRow({ back:{label:"Back", fn:function(){}}, extra:extra, next:{label:"Next: recall", fn:function(){}} });
  h += '</section>';
  el("main").innerHTML = h;
  wireNext({ back:{fn:function(){ setPos(Q, backPos); }}, next:{fn:function(){ setPos(Q, L.recall(i)); }} });
  if(el("skipBtn")) el("skipBtn").onclick = function(){ S.skipped = true; setPos(Q, L.start); };
}

/* ---------- recall ---------- */
function renderRecall(Q,S,i){
  var L = layout(Q), c = Q.cards[i], r = S.recall[i];
  var h = '<section class="screen">';
  h += '<div class="eyebrow">Recall '+(i+1)+' of '+Q.cards.length+'</div><h2 class="h2">'+esc(c.title)+'</h2>';
  h += '<p class="lede">Without looking back, write down the six to eight most important facts from the card you have just read. Put each fact on a new line.</p>';
  if(r.checked) h += '<div class="note ok">You have checked your list. Write any facts you left out at the end of your list.</div>';
  else h += '<div class="note">You can go back to the card after you check your list.</div>';
  h += '<label for="recallBox" class="hidden">Your facts</label><textarea id="recallBox" placeholder="1. ...">'+esc(r.text)+'</textarea>';
  h += '<div class="count" id="cnt"></div>';
  var nextPos = i < Q.cards.length-1 ? L.card(i+1) : L.start;
  var nextLab = i < Q.cards.length-1 ? "Next: card "+(i+2) : "Next: the timed quiz";
  var extra = r.checked ? '<button class="btn ghost" id="seeBtn">See the key facts again</button>' : '<button class="btn" id="checkBtn">Check my list</button>';
  h += nextRow({ back:{label:"Back to the card", disabled:!r.checked, fn:function(){}}, extra:extra,
    next:{ label:nextLab, disabled:!r.checked, hint:"Check your list first.", fn:function(){} } });
  h += '</section>';
  el("main").innerHTML = h;
  var box = el("recallBox");
  function upd(){
    var n = lines(box.value);
    el("cnt").textContent = n===0 ? "Aim for six to eight facts." : (n===1 ? "1 fact so far." : n+" facts so far.") + (n>0 && n<6 ? " Aim for six to eight." : "");
    if(el("checkBtn")) el("checkBtn").disabled = n===0;
  }
  box.oninput = function(){ r.text = box.value; put(Q); upd(); };
  upd();
  wireNext({ back:{disabled:!r.checked, fn:function(){ setPos(Q, L.card(i)); }}, next:{disabled:!r.checked, fn:function(){ setPos(Q, nextPos); }} });
  if(el("checkBtn")) el("checkBtn").onclick = function(){
    if(lines(box.value)===0) return;
    r.text = box.value; r.checked = true; put(Q);
    render();
    showFacts(Q,i);
  };
  if(el("seeBtn")) el("seeBtn").onclick = function(){ showFacts(Q,i); };
  if(!r.checked) box.focus();
}
function showFacts(Q,i){
  var c = Q.cards[i];
  var h = '<div class="overlay" id="ov" role="dialog" aria-modal="true" aria-labelledby="mt"><div class="modal">';
  h += '<div class="eyebrow">Compare</div><h2 class="h2" id="mt">The key facts: '+esc(c.title)+'</h2>';
  h += '<p>Compare these with your list. Write down any you left out at the end of your list.</p><ol>';
  c.facts.forEach(function(f){ h += '<li>'+esc(f)+'</li>'; });
  h += '</ol><div class="btnrow"><button class="btn" id="closeM">Back to my list</button></div></div></div>';
  el("modalRoot").innerHTML = h;
  el("closeM").onclick = function(){ closeModal(); var b=el("recallBox"); if(b){ b.focus(); b.selectionStart=b.selectionEnd=b.value.length; } };
  el("ov").onclick = function(e){ if(e.target.id==="ov") el("closeM").click(); };
  el("closeM").focus();
}
function closeModal(){ var m=el("modalRoot"); if(m) m.innerHTML=""; }
document.addEventListener("keydown", function(e){ if(e.key==="Escape" && el("closeM")) el("closeM").click(); });

/* ---------- quiz start ---------- */
function firstUnanswered(Q,S){
  var L = layout(Q);
  if(!S.quiz) return L.start;
  for(var j=0;j<Q.questions.length;j++){ if(!(Q.questions[j].id in S.quiz.answers)) return L.q(j); }
  return L.q(Q.questions.length-1);
}
function startQuiz(Q){
  var S = getState(Q), opt = {};
  Q.questions.forEach(function(q){ opt[q.id] = shuffle(q.options.map(function(_,i){return i;})); });
  var now = Date.now();
  S.quiz = { startedAt:now, endAt: now + QUIZ_MINUTES*60000, answers:{}, opt:opt, done:false, timedOut:false };
  S.attempts = (S.attempts||0)+1;
  put(Q); setPos(Q, layout(Q).q(0));
}
function renderStart(Q,S){
  var L = layout(Q);
  var h = '<section class="screen">';
  h += '<div class="eyebrow">Timed quiz</div><h2 class="h2">'+Q.questions.length+' questions in '+QUIZ_MINUTES+' minutes</h2>';
  if(quizDone(S)){
    h += '<div class="note ok">You have finished this quiz. You can review your answers or take it again.</div>';
  } else if(quizRunning(S)){
    h += '<div class="note fix">Your clock is running.</div>';
  } else {
    h += '<p class="lede">The clock starts when you press the button and keeps running until you finish. When time runs out, the quiz closes and you see your results. Questions you have not answered count as unanswered.</p>';
    h += '<div class="grid g3">';
    LEVELS.forEach(function(lv){
      var n = Q.questions.filter(function(q){return q.level===lv.id;}).length;
      h += '<div class="card"><span class="chip lv">'+lv.name+' · '+n+' questions</span><p style="margin-top:10px">'+esc(lv.text)+'</p></div>';
    });
    h += '</div>';
    h += '<div class="note" style="margin-top:16px">After each answer you will see why it is right or wrong. Read the feedback: it is part of the learning. The revision cards are locked while the clock runs.</div>';
    if(S.skipped && S.recall.some(function(r){return !r.checked;})) h += '<div class="note fix">You skipped some of the revision. You can go back to it now, before you start the clock.</div>';
  }
  var nxt;
  if(quizDone(S)) nxt = { label:"Review your answers", fn:function(){ setPos(Q, L.q(0)); } };
  else if(quizRunning(S)) nxt = { label:"Continue the quiz", fn:function(){ setPos(Q, firstUnanswered(Q,S)); } };
  else nxt = { label:"Start the clock", fn:function(){ startQuiz(Q); } };
  var backOpt = quizRunning(S) ? null : { label:"Back", fn:function(){ setPos(Q, L.recall(Q.cards.length-1)); } };
  var extra = quizDone(S) ? '<button class="btn ghost" id="resBtn">See your results</button>' : '';
  h += nextRow({ back:backOpt, extra:extra, next:nxt });
  h += '</section>';
  el("main").innerHTML = h;
  wireNext({ back:backOpt, next:nxt });
  if(el("resBtn")) el("resBtn").onclick = function(){ setPos(Q, L.results); };
}

/* ---------- question ---------- */
function levelName(id){ for(var i=0;i<LEVELS.length;i++){ if(LEVELS[i].id===id) return LEVELS[i].name; } return id; }
function renderQuestion(Q,S,j){
  var L = layout(Q);
  if(!S.quiz){ setPos(Q, L.start); return; }
  var q = Q.questions[j], order = S.quiz.opt[q.id] || q.options.map(function(_,i){return i;});
  var ans = S.quiz.answers[q.id]; // index into q.options
  var answered = typeof ans === "number";
  var done = quizDone(S);
  var reveal = answered || done;
  var correctIdx = -1; q.options.forEach(function(o,i){ if(o.ok) correctIdx=i; });
  var h = '<section class="screen">';
  h += '<div class="timerbar"><div class="meta"><span>Question '+(j+1)+' of '+Q.questions.length+'</span><span class="chip lv">'+levelName(q.level)+'</span></div>';
  h += '<div class="qdots" aria-hidden="true">';
  Q.questions.forEach(function(qq,k){ var c = k===j ? "c" : ((qq.id in S.quiz.answers) ? "a" : ""); h += '<span class="'+c+'"></span>'; });
  h += '</div>';
  if(done) h += '<div class="meta">Review</div>';
  else h += '<div class="clk" id="clk">'+fmt(S.quiz.endAt-Date.now())+'</div>';
  h += '</div>';
  h += '<p class="prompt">'+esc(q.prompt)+'</p><div class="opts">';
  order.forEach(function(oi,pos){
    var o = q.options[oi], cls = "";
    if(reveal){
      if(oi===correctIdx) cls = (answered && ans===oi) ? "right" : "missed";
      if(answered && ans===oi && oi!==correctIdx) cls = "wrong";
    }
    h += '<button class="opt '+cls+'" data-oi="'+oi+'" '+(reveal?"disabled":"")+'><span class="k">'+LETTERS[pos]+'</span><span>'+esc(o.t)+'</span></button>';
  });
  h += '</div>';
  if(reveal){
    h += '<div class="fb">';
    if(!answered){
      h += '<div class="note fix"><span class="v">You did not answer this one.</span>The answer: '+esc(q.options[correctIdx].t)+'. '+esc(q.options[correctIdx].why)+'</div>';
    } else if(ans===correctIdx){
      h += '<div class="note ok"><span class="v">'+esc(q.right||"That's right.")+'</span>'+esc(q.options[ans].why)+'</div>';
    } else {
      h += '<div class="note fix"><span class="v">'+esc(q.wrong||"Not quite.")+'</span>'+esc(q.options[ans].why)+'</div>';
      h += '<div class="note ok"><span class="v">The best answer: '+esc(q.options[correctIdx].t)+'</span>'+esc(q.options[correctIdx].why)+'</div>';
    }
    h += '</div>';
  }
  var last = j===Q.questions.length-1;
  var backOpt = j>0 ? { label:"Previous question", fn:function(){ setPos(Q, L.q(j-1)); } } : (done ? { label:"Back", fn:function(){ setPos(Q, L.start); } } : null);
  var nxt;
  if(done) nxt = { label: last ? "Back to your results" : "Next question", fn:function(){ setPos(Q, last ? L.results : L.q(j+1)); } };
  else nxt = { label: last ? "Finish the quiz" : "Next question", disabled: !answered, hint:"Choose an answer first.", fn:function(){ if(last) finishQuiz(Q,false); else setPos(Q, L.q(j+1)); } };
  h += nextRow({ back:backOpt, next:nxt });
  h += '</section>';
  el("main").innerHTML = h;
  wireNext({ back:backOpt, next:nxt });
  if(!reveal){
    Array.prototype.forEach.call(document.querySelectorAll(".opt"), function(b){
      b.onclick = function(){
        if(quizDone(S)) return;
        if(Date.now() >= S.quiz.endAt){ finishQuiz(Q,true); return; }
        S.quiz.answers[q.id] = parseInt(b.getAttribute("data-oi"),10);
        put(Q); render();
        var fb = document.querySelector(".fb"); if(fb && fb.scrollIntoView){ try{ fb.scrollIntoView({block:"nearest", behavior:"smooth"}); }catch(e){} }
      };
    });
  }
}

/* ---------- results ---------- */
function scoreOf(Q,S){
  var res = { total:0, unanswered:0, by:{} };
  LEVELS.forEach(function(lv){ res.by[lv.id] = { right:0, of:0 }; });
  Q.questions.forEach(function(q){
    var b = res.by[q.level]; b.of++;
    var a = S.quiz ? S.quiz.answers[q.id] : undefined;
    if(typeof a !== "number"){ res.unanswered++; return; }
    if(q.options[a].ok){ b.right++; res.total++; }
  });
  return res;
}
function renderResults(Q,S){
  var L = layout(Q);
  if(!quizDone(S)){ setPos(Q, L.start); return; }
  var sc = scoreOf(Q,S);
  var h = '<section class="screen">';
  h += '<div class="eyebrow">Results</div><h2 class="h2">Quiz '+Q.num+': '+esc(Q.title)+'</h2>';
  h += '<div class="score"><span class="big">'+sc.total+'</span><span class="of">out of '+Q.questions.length+'</span></div>';
  if(S.quiz.timedOut) h += '<p class="muted">Time ran out'+(sc.unanswered ? ', with '+sc.unanswered+' question'+(sc.unanswered===1?'':'s')+' unanswered' : '')+'.</p>';
  else h += '<p class="muted">You finished in '+fmt(S.quiz.usedMs)+'.</p>';
  h += '<div class="card" style="margin:16px 0">';
  var weakest = null;
  LEVELS.forEach(function(lv){
    var b = sc.by[lv.id], pct = b.of ? Math.round(100*b.right/b.of) : 0;
    if(b.of && (weakest===null || b.right/b.of < weakest.p)) weakest = { lv:lv, p:b.right/b.of };
    h += '<div class="lvrow"><span class="nm">'+lv.name+'</span><span class="bar" role="img" aria-label="'+b.right+' of '+b.of+'"><i style="width:'+pct+'%"></i></span><span class="sc">'+b.right+' / '+b.of+'</span></div>';
    h += '<p class="lvtext">'+esc(lv.text)+'</p>';
  });
  h += '</div>';
  if(sc.total===Q.questions.length) h += '<div class="note ok">Every answer correct. Try another quiz, or come back to this one in a few days to check that it has stuck.</div>';
  else if(weakest && weakest.p < 1) h += '<div class="note fix"><span class="v">Your weakest level: '+weakest.lv.name+'</span>'+esc(weakest.lv.tip)+'</div>';
  h += '<div class="btnrow" style="margin-top:8px"><button class="btn" id="revBtn">Review your answers</button><button class="btn ghost" id="againBtn">Take the quiz again</button><button class="btn ghost" id="cardsBtn">Go back to the revision cards</button></div>';
  h += nextRow({ back:{label:"Back", fn:function(){}}, next:{label:"All quizzes", fn:function(){}} });
  h += '</section>';
  el("main").innerHTML = h;
  wireNext({ back:{fn:function(){ setPos(Q, L.q(Q.questions.length-1)); }}, next:{fn:function(){ go(null); }} });
  el("revBtn").onclick = function(){ setPos(Q, L.q(0)); };
  el("againBtn").onclick = function(){ S.quiz = null; put(Q); setPos(Q, L.start); };
  el("cardsBtn").onclick = function(){ setPos(Q, L.card(0)); };
}

/* ---------- boot ---------- */
var last = null; try{ last = window.localStorage.getItem(KEY_PREFIX+"last"); }catch(e){}
current = last && byId(last) ? last : null;
startTicker();
render();
})();
</script>
